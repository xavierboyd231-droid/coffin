        let games = [...gamesList];

        function dismissBoot() {
            const boot = document.getElementById('bootScreen');
            if (boot) {
                boot.style.opacity = '0';
                setTimeout(() => boot.style.display = 'none', 400);
            }
        }
        setTimeout(dismissBoot, 800);

        // Canvas Background Animation
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = Array.from({length: 40}, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 5 + 2,
            speedY: Math.random() * 1.5 + 0.8
        }));

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--accent');
            ctx.globalAlpha = 0.15;
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y > height) p.y = -10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // Render Games
        let currentCat = 'all';
        function renderGames(list) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game);
                card.innerHTML = `
                    <div>
                        <div class="game-header">
                            <span class="game-tag">${game.category}</span>
                            <span class="game-rating">★ ${game.rating}</span>
                        </div>
                        <div class="game-title">${game.title}</div>
                    </div>
                    <div class="game-footer">
                        <span class="game-players">${game.players} online</span>
                        <button class="play-btn">Play</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        renderGames(games);

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => 
                (currentCat === 'all' || g.category === currentCat) &&
                g.title.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }

        function setCategory(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterGames();
        }

        // Modal Controls
        let activeUrl = '';
        function launchGame(game) {
            activeUrl = game.url;
            document.getElementById('modalGameTitle').innerText = game.title;
            document.getElementById('modalBody').innerHTML = `<iframe src="${game.url}" allowfullscreen></iframe>`;
            document.getElementById('gameModal').style.display = 'flex';
        }
        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }
        function reloadGame() {
            const iframe = document.querySelector('#modalBody iframe');
            if(iframe) iframe.src = activeUrl;
        }
        function popoutGame() {
            const win = window.open('about:blank', '_blank');
            win.document.write(`<iframe src="${activeUrl}" style="width:100vw; height:100vh; border:none; margin:0;" allowfullscreen></iframe>`);
        }
        function toggleFullscreen() {
            const modal = document.getElementById('gameModal');
            if (!document.fullscreenElement) modal.requestFullscreen();
            else document.exitFullscreen();
        }

        // Party Chat
        const channel = new BroadcastChannel('chocolates_party');
        let currentRoom = 'general';
        function openChat() { document.getElementById('chatModal').style.display = 'flex'; }
        function closeChat() { document.getElementById('chatModal').style.display = 'none'; }
        function createParty() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(code) { currentRoom = code; appendChat('System', `Joined room: ${code}`); }
        }
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;
            channel.postMessage({ room: currentRoom, sender: 'Peer', text: msg });
            appendChat('You', msg);
            input.value = '';
        }
        channel.onmessage = (e) => {
            if(e.data.room === currentRoom) appendChat(e.data.sender, e.data.text);
        };
        function appendChat(sender, text) {
            const box = document.getElementById('chatMessages');
            box.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // Request Form
        function openRequest() { document.getElementById('requestModal').style.display = 'flex'; }
        function closeRequest() { document.getElementById('requestModal').style.display = 'none'; }
        function submitRequest() {
            const name = document.getElementById('reqGameName').value;
            if(!name) return;
            fetch("https://formsubmit.co/ajax/xavierboyd231@gmail.com", {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ game_request: name })
            }).catch(() => {});
            alert("Request sent!");
            document.getElementById('reqGameName').value = '';
            closeRequest();
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('choc_theme', theme);
        }
        const savedTheme = localStorage.getItem('choc_theme');
        if(savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeSelect').value = savedTheme;
        }

        // Cloak
        function toggleCloak() {
            const c = document.getElementById('googleCloak');
            c.style.display = c.style.display === 'flex' ? 'none' : 'flex';
        }
        window.addEventListener('keydown', (e) => {
            if(e.key === '~') { e.preventDefault(); toggleCloak(); }
        });
